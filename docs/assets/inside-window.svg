<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="560" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="557" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="552" width="1100" height="4" fill="url(#redline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <g fill="none" stroke="#ff3b30" stroke-linejoin="round">
    <path d="M104 32 111 18 118 32 Z" stroke-width="2"/>
    <path d="M108.2 29.5 111 23.9 113.8 29.5 Z" stroke-width="1.4"/>
  </g>
  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">inside the window — a kernel, a registry, and a fleet of panels</text>

  <!-- panels row (top) -->
  <text x="60" y="80" fill="#8b949e" font-size="12">27 self-registering panels · web/panels/*</text>
  <g font-size="13" font-weight="bold">
    <rect x="60" y="94" width="200" height="46" rx="8" fill="#161b22" stroke="#6fb7d9" stroke-width="2"/>
    <text x="160" y="122" text-anchor="middle" fill="#6fb7d9">CODE · iT · BROWSER</text>
    <rect x="276" y="94" width="230" height="46" rx="8" fill="#161b22" stroke="#b18bf5" stroke-width="2"/>
    <text x="391" y="122" text-anchor="middle" fill="#b18bf5">LAB · HARNESS · MATRIX</text>
    <rect x="522" y="94" width="230" height="46" rx="8" fill="#161b22" stroke="#3fd68f" stroke-width="2"/>
    <text x="637" y="122" text-anchor="middle" fill="#3fd68f">NOTES · EMAIL · TASKS</text>
    <rect x="768" y="94" width="272" height="46" rx="8" fill="#161b22" stroke="#e8b86d" stroke-width="2"/>
    <text x="904" y="122" text-anchor="middle" fill="#e8b86d">GALLERY · SETTINGS · …</text>
  </g>

  <path d="M550 140 550 172" stroke="#566070" stroke-width="2"/>
  <path d="M545 165 550 173 555 165" fill="none" stroke="#566070" stroke-width="2"/>
  <text x="568" y="164" fill="#566070" font-size="11">every panel uses the same four pieces — never each other</text>

  <!-- core row -->
  <g>
    <rect x="60" y="184" width="235" height="150" rx="10" fill="#161b22" stroke="#b18bf5" stroke-width="2"/>
    <text x="80" y="212" fill="#b18bf5" font-weight="bold">Bus</text>
    <text x="80" y="236" fill="#c9d1d9" font-size="12">pub / sub</text>
    <text x="80" y="258" fill="#8b949e" font-size="12">the ONLY wiring</text>
    <text x="80" y="276" fill="#8b949e" font-size="12">between modules</text>
    <text x="80" y="312" fill="#566070" font-size="11">Bus.emit · Bus.on</text>

    <rect x="311" y="184" width="235" height="150" rx="10" fill="#161b22" stroke="#b18bf5" stroke-width="2"/>
    <text x="331" y="212" fill="#b18bf5" font-weight="bold">Kernel</text>
    <text x="331" y="236" fill="#c9d1d9" font-size="12">escapers · panelBus</text>
    <text x="331" y="256" fill="#c9d1d9" font-size="12">time · fetch · persisted</text>
    <text x="331" y="276" fill="#c9d1d9" font-size="12">dragGesture</text>
    <text x="331" y="312" fill="#566070" font-size="11">URL-scheme guards</text>

    <rect x="562" y="184" width="235" height="150" rx="10" fill="#161b22" stroke="#6fb7d9" stroke-width="2"/>
    <text x="582" y="212" fill="#6fb7d9" font-weight="bold">Panel registry</text>
    <text x="582" y="236" fill="#c9d1d9" font-size="12">one data-driven table</text>
    <text x="582" y="258" fill="#8b949e" font-size="12">registerPanel</text>
    <text x="582" y="278" fill="#8b949e" font-size="12">openPanel</text>
    <text x="582" y="312" fill="#566070" font-size="11">a new panel = one line</text>

    <rect x="813" y="184" width="227" height="150" rx="10" fill="#161b22" stroke="#ff3b30" stroke-width="2"/>
    <text x="833" y="212" fill="#ff6b61" font-weight="bold">BridgeClient</text>
    <text x="833" y="236" fill="#c9d1d9" font-size="12">the ONE egress</text>
    <text x="833" y="258" fill="#8b949e" font-size="12">token · headers ·</text>
    <text x="833" y="276" fill="#8b949e" font-size="12">timeouts, in one place</text>
    <text x="833" y="312" fill="#566070" font-size="11">nothing else calls out</text>
  </g>

  <!-- egress to bridge -->
  <path d="M926 334 926 388" stroke="#ff3b30" stroke-width="2.5"/>
  <path d="M921 381 926 389 931 381" fill="none" stroke="#ff3b30" stroke-width="2.5"/>
  <rect x="716" y="396" width="324" height="56" rx="10" fill="#161b22" stroke="#ff3b30" stroke-width="2"/>
  <text x="878" y="422" text-anchor="middle"><tspan fill="#ff6b61" font-weight="bold">HUB BRIDGE</tspan><tspan fill="#8b949e" font-size="12"> · 127.0.0.1:8765</tspan></text>
  <text x="878" y="441" text-anchor="middle" fill="#566070" font-size="11">two channels — see the boundary law</text>

  <text x="60" y="420" fill="#c9d1d9" font-size="13">one index.html — not a blob:</text>
  <text x="60" y="442" fill="#8b949e" font-size="12">panels mount on demand, talk over the Bus,</text>
  <text x="60" y="462" fill="#8b949e" font-size="12">and reach the world through ONE client.</text>

  <text x="550" y="512" text-anchor="middle" fill="#8b949e" font-size="13">single place for the token · single place for wiring · single line to add a panel</text>
</svg>
