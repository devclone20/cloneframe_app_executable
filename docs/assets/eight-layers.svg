<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="997" height="557" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="552" width="1000" height="4" fill="url(#redline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <g fill="none" stroke="#ff3b30" stroke-linejoin="round">
    <path d="M104 32 111 18 118 32 Z" stroke-width="2"/>
    <path d="M108.2 29.5 111 23.9 113.8 29.5 Z" stroke-width="1.4"/>
  </g>
  <text x="500" y="31" text-anchor="middle" font-size="13" fill="#8b949e">eight layers — each rests on the one below · read bottom-up</text>

  <!-- tower, L7 on top -->
  <g font-size="13">
    <rect x="120" y="62" width="760" height="50" rx="8" fill="#161b22" stroke="#ff3b30" stroke-width="2"/>
    <text x="140" y="93"><tspan fill="#ff6b61" font-weight="bold">L7 · hardening</tspan><tspan fill="#8b949e">  —  the security regression suite</tspan></text>

    <rect x="140" y="120" width="720" height="50" rx="8" fill="#161b22" stroke="#3fd68f" stroke-width="2"/>
    <text x="160" y="151"><tspan fill="#3fd68f" font-weight="bold">L6 · panels</tspan><tspan fill="#8b949e">  —  20 self-registering frames</tspan></text>

    <rect x="160" y="178" width="680" height="50" rx="8" fill="#161b22" stroke="#6fb7d9" stroke-width="2"/>
    <text x="180" y="209"><tspan fill="#6fb7d9" font-weight="bold">L5 · design system</tspan><tspan fill="#8b949e">  —  UI primitives · panel registry</tspan></text>

    <rect x="180" y="236" width="640" height="50" rx="8" fill="#161b22" stroke="#b18bf5" stroke-width="2"/>
    <text x="200" y="267"><tspan fill="#b18bf5" font-weight="bold">L4 · frontend kernel</tspan><tspan fill="#8b949e">  —  escapers · bus · scheme guards</tspan></text>

    <rect x="200" y="294" width="600" height="50" rx="8" fill="#161b22" stroke="#e8b86d" stroke-width="2"/>
    <text x="220" y="325"><tspan fill="#e8b86d" font-weight="bold">L3 · protocol &amp; router</tspan><tspan fill="#8b949e">  —  /mod is the only seam</tspan></text>

    <rect x="220" y="352" width="560" height="50" rx="8" fill="#161b22" stroke="#56d0e0" stroke-width="2"/>
    <text x="240" y="383"><tspan fill="#56d0e0" font-weight="bold">L2 · domains</tspan><tspan fill="#8b949e">  —  mail · pim · content · agent · web3 · chat</tspan></text>

    <rect x="240" y="410" width="520" height="50" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="260" y="441"><tspan fill="#c9d1d9" font-weight="bold">L1 · platform services</tspan><tspan fill="#8b949e">  —  storage · http · model · guards</tspan></text>

    <rect x="260" y="468" width="480" height="50" rx="8" fill="#161b22" stroke="#566070" stroke-width="2"/>
    <text x="280" y="499"><tspan fill="#c9d1d9" font-weight="bold">L0 · foundation</tspan><tspan fill="#8b949e">  —  single-file build · tests · hygiene</tspan></text>
  </g>

  <text x="920" y="280" text-anchor="middle" fill="#566070" font-size="11" transform="rotate(90 920 280)">a change here cannot quietly break a distant panel</text>
</svg>
