  <text x="60" y="508" fill="#8b949e" font-size="12" font-weight="bold">CONTENT &amp; SYSTEM</text>
  <g font-size="13" font-weight="bold">
    <rect x="60" y="520" width="180" height="42" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="150" y="546" text-anchor="middle" fill="#c9d1d9">GALLERY</text>
    <rect x="252" y="520" width="180" height="42" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="342" y="546" text-anchor="middle" fill="#c9d1d9">LIBRARY</text>
    <rect x="444" y="520" width="180" height="42" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="534" y="546" text-anchor="middle" fill="#c9d1d9">SETTINGS</text>
    <rect x="636" y="520" width="180" height="42" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="726" y="546" text-anchor="middle" fill="#c9d1d9">THEME</text>
