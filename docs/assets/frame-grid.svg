    <text x="414" y="460" text-anchor="middle" fill="#e8b86d">AUTOMATIONS</text>
    <rect x="540" y="434" width="228" height="42" rx="8" fill="#161b22" stroke="#e8b86d" stroke-width="2"/>
    <text x="654" y="460" text-anchor="middle" fill="#e8b86d">APPROVAL</text>
