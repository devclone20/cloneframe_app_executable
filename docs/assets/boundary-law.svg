<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="540" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="537" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="532" width="1100" height="4" fill="url(#redline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <g fill="none" stroke="#ff3b30" stroke-linejoin="round">
    <path d="M104 32 111 18 118 32 Z" stroke-width="2"/>
    <path d="M108.2 29.5 111 23.9 113.8 29.5 Z" stroke-width="1.4"/>
  </g>
  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">the boundary law — two channels, one gate, nothing else</text>

  <!-- incoming channels -->
  <rect x="40" y="90" width="250" height="72" rx="10" fill="#161b22" stroke="#6fb7d9" stroke-width="2"/>
  <text x="60" y="118" fill="#6fb7d9" font-weight="bold">CONTROL</text>
  <text x="60" y="140" fill="#8b949e" font-size="12">HTTP POST /mod/&lt;name&gt;</text>
  <text x="60" y="156" fill="#566070" font-size="11">{ fn, args }</text>

  <rect x="40" y="190" width="250" height="72" rx="10" fill="#161b22" stroke="#b18bf5" stroke-width="2"/>
  <text x="60" y="218" fill="#b18bf5" font-weight="bold">DATA</text>
  <text x="60" y="240" fill="#8b949e" font-size="12">WebSocket /stream</text>
  <text x="60" y="256" fill="#566070" font-size="11">token never in the URL</text>

  <path d="M290 126 366 160" stroke="#566070" stroke-width="2"/>
  <path d="M290 226 366 200" stroke="#566070" stroke-width="2"/>
  <path d="M358 156 368 161 362 170" fill="none" stroke="#566070" stroke-width="2"/>

  <!-- the gate -->
  <rect x="372" y="80" width="400" height="380" rx="10" fill="#161b22" stroke="#ff3b30" stroke-width="2.5"/>
  <text x="392" y="112"><tspan fill="#ff6b61" font-weight="bold">THE GATE</tspan><tspan fill="#8b949e" font-size="12"> — every request, same five checks</tspan></text>

  <g font-size="13">
    <rect x="392" y="130" width="360" height="50" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="410" y="151"><tspan fill="#3fd68f">1 ✓</tspan><tspan fill="#c9d1d9"> loopback only</tspan></text>
    <text x="410" y="169" fill="#566070" font-size="11">binds 127.0.0.1 — never the network</text>

    <rect x="392" y="188" width="360" height="50" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="410" y="209"><tspan fill="#3fd68f">2 ✓</tspan><tspan fill="#c9d1d9"> Host-header allowlist</tspan></text>
    <text x="410" y="227" fill="#566070" font-size="11">blocks DNS-rebinding</text>

    <rect x="392" y="246" width="360" height="50" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="410" y="267"><tspan fill="#3fd68f">3 ✓</tspan><tspan fill="#c9d1d9"> Bearer pairing token</tspan></text>
    <text x="410" y="285" fill="#566070" font-size="11">fresh per session</text>

    <rect x="392" y="304" width="360" height="50" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="410" y="325"><tspan fill="#3fd68f">4 ✓</tspan><tspan fill="#c9d1d9"> Sec-Fetch-Dest gate</tspan></text>
    <text x="410" y="343" fill="#566070" font-size="11">token served only on real navigation</text>

    <rect x="392" y="362" width="360" height="50" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="410" y="383"><tspan fill="#3fd68f">5 ✓</tspan><tspan fill="#c9d1d9"> _private functions unreachable</tspan></text>
    <text x="410" y="401" fill="#566070" font-size="11">a leading underscore hides a fn from RPC</text>
  </g>

  <!-- outcomes -->
  <path d="M772 200 848 200" stroke="#3fd68f" stroke-width="2.5"/>
  <path d="M840 194 849 200 840 206" fill="none" stroke="#3fd68f" stroke-width="2.5"/>
  <rect x="854" y="164" width="206" height="72" rx="10" fill="#161b22" stroke="#3fd68f" stroke-width="2"/>
  <text x="874" y="192" fill="#3fd68f" font-weight="bold">✓ dispatched</text>
  <text x="874" y="214" fill="#8b949e" font-size="12">to a named module</text>

  <path d="M772 350 848 350" stroke="#ff3b30" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M840 344 849 350 840 356" fill="none" stroke="#ff3b30" stroke-width="2.5"/>
  <rect x="854" y="314" width="206" height="72" rx="10" fill="#161b22" stroke="#ff3b30" stroke-width="2"/>
  <text x="874" y="342" fill="#ff6b61" font-weight="bold">✗ refused</text>
  <text x="874" y="364" fill="#8b949e" font-size="12">fails ANY check</text>

  <text x="550" y="502" text-anchor="middle" fill="#8b949e" font-size="13">a malicious page, another local user, a rogue script — no path to your machine skips this gate</text>
</svg>
