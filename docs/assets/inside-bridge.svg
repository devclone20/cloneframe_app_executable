<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="620" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="617" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="612" width="1100" height="4" fill="url(#redline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <g fill="none" stroke="#ff3b30" stroke-linejoin="round">
    <path d="M104 32 111 18 118 32 Z" stroke-width="2"/>
    <path d="M108.2 29.5 111 23.9 113.8 29.5 Z" stroke-width="1.4"/>
  </g>
  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">inside the bridge — layered on purpose</text>

  <!-- in -->
  <rect x="330" y="62" width="440" height="42" rx="21" fill="#161b22" stroke="#6fb7d9" stroke-width="2"/>
  <text x="550" y="89" text-anchor="middle"><tspan fill="#6fb7d9" font-weight="bold">/mod/&lt;name&gt;</tspan><tspan fill="#8b949e"> — from the window</tspan></text>
  <path d="M550 104 550 130" stroke="#566070" stroke-width="2"/>
  <path d="M545 123 550 131 555 123" fill="none" stroke="#566070" stroke-width="2"/>

  <!-- router -->
  <rect x="120" y="138" width="860" height="66" rx="10" fill="#161b22" stroke="#ff3b30" stroke-width="2"/>
  <text x="140" y="166"><tspan fill="#ff6b61" font-weight="bold">ROUTER</tspan><tspan fill="#8b949e" font-size="12"> · hub-bridge.mjs</tspan></text>
  <text x="140" y="188" fill="#c9d1d9" font-size="13">transport + security + dispatch — nothing else</text>
  <path d="M550 204 550 230" stroke="#566070" stroke-width="2"/>
  <path d="M545 223 550 231 555 223" fill="none" stroke="#566070" stroke-width="2"/>

  <!-- domains -->
  <rect x="120" y="238" width="860" height="118" rx="10" fill="#161b22" stroke="#e8b86d" stroke-width="2"/>
  <text x="140" y="266"><tspan fill="#e8b86d" font-weight="bold">DOMAINS</tspan><tspan fill="#8b949e" font-size="12"> — the meaning · the why and when</tspan></text>
  <g font-size="13" font-weight="bold">
    <rect x="140" y="284" width="120" height="46" rx="8" fill="#0d1117" stroke="#e8b86d" stroke-width="1.5"/>
    <text x="200" y="312" text-anchor="middle" fill="#e8b86d">chat</text>
    <rect x="276" y="284" width="120" height="46" rx="8" fill="#0d1117" stroke="#e8b86d" stroke-width="1.5"/>
    <text x="336" y="312" text-anchor="middle" fill="#e8b86d">mail</text>
    <rect x="412" y="284" width="120" height="46" rx="8" fill="#0d1117" stroke="#e8b86d" stroke-width="1.5"/>
    <text x="472" y="312" text-anchor="middle" fill="#e8b86d">pim</text>
    <rect x="548" y="284" width="120" height="46" rx="8" fill="#0d1117" stroke="#e8b86d" stroke-width="1.5"/>
    <text x="608" y="312" text-anchor="middle" fill="#e8b86d">content</text>
    <rect x="684" y="284" width="120" height="46" rx="8" fill="#0d1117" stroke="#e8b86d" stroke-width="1.5"/>
    <text x="744" y="312" text-anchor="middle" fill="#e8b86d">agent</text>
    <rect x="820" y="284" width="120" height="46" rx="8" fill="#0d1117" stroke="#e8b86d" stroke-width="1.5"/>
    <text x="880" y="312" text-anchor="middle" fill="#e8b86d">web3</text>
  </g>
  <path d="M550 356 550 382" stroke="#566070" stroke-width="2"/>
  <path d="M545 375 550 383 555 375" fill="none" stroke="#566070" stroke-width="2"/>

  <!-- platform -->
  <rect x="120" y="390" width="860" height="132" rx="10" fill="#161b22" stroke="#3fd68f" stroke-width="2"/>
  <text x="140" y="418"><tspan fill="#3fd68f" font-weight="bold">PLATFORM</tspan><tspan fill="#8b949e" font-size="12"> — the mechanics · one home per concern</tspan></text>
  <g font-size="12">
    <rect x="140" y="436" width="192" height="34" rx="8" fill="#0d1117" stroke="#3fd68f" stroke-width="1.5"/>
    <text x="236" y="458" text-anchor="middle" fill="#c9d1d9">json-store</text>
    <rect x="344" y="436" width="192" height="34" rx="8" fill="#0d1117" stroke="#3fd68f" stroke-width="1.5"/>
    <text x="440" y="458" text-anchor="middle" fill="#c9d1d9">http · SSRF guard</text>
    <rect x="548" y="436" width="192" height="34" rx="8" fill="#0d1117" stroke="#3fd68f" stroke-width="1.5"/>
    <text x="644" y="458" text-anchor="middle" fill="#c9d1d9">llm — the model port</text>
    <rect x="752" y="436" width="188" height="34" rx="8" fill="#0d1117" stroke="#3fd68f" stroke-width="1.5"/>
    <text x="846" y="458" text-anchor="middle" fill="#c9d1d9">evm · dav</text>
    <rect x="140" y="478" width="192" height="34" rx="8" fill="#0d1117" stroke="#3fd68f" stroke-width="1.5"/>
    <text x="236" y="500" text-anchor="middle" fill="#c9d1d9">cli-gate</text>
    <rect x="344" y="478" width="192" height="34" rx="8" fill="#0d1117" stroke="#3fd68f" stroke-width="1.5"/>
    <text x="440" y="500" text-anchor="middle" fill="#c9d1d9">shell-guard</text>
    <rect x="548" y="478" width="192" height="34" rx="8" fill="#0d1117" stroke="#3fd68f" stroke-width="1.5"/>
    <text x="644" y="500" text-anchor="middle" fill="#c9d1d9">redact — secrets</text>
    <rect x="752" y="478" width="188" height="34" rx="8" fill="#0d1117" stroke="#3fd68f" stroke-width="1.5"/>
    <text x="846" y="500" text-anchor="middle" fill="#c9d1d9">fail-closed gates</text>
  </g>
  <path d="M550 522 550 548" stroke="#566070" stroke-width="2"/>
  <path d="M545 541 550 549 555 541" fill="none" stroke="#566070" stroke-width="2"/>

  <!-- os -->
  <rect x="330" y="554" width="440" height="40" rx="20" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="550" y="580" text-anchor="middle"><tspan fill="#e6edf3" font-weight="bold">your machine</tspan><tspan fill="#8b949e" font-size="12"> — files · processes · network · model</tspan></text>

  <text x="1040" y="180" text-anchor="end" fill="#566070" font-size="11">one SSRF check</text>
  <text x="1040" y="330" text-anchor="end" fill="#566070" font-size="11">one command guard</text>
  <text x="1040" y="580" text-anchor="end" fill="#566070" font-size="11">one redactor</text>
</svg>
