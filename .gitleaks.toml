# CLONE FRAME HUB — gitleaks config for the public-mirror sterilization gate (scripts/sync-mirror.sh).
# Keeps the FULL default ruleset active for our own code; allowlists only vendored / built
# third-party bundles whose minified contents trip the generic-api-key rule with false positives.
# These bundles ship to the browser as-is (they contain no secret of ours) — allowlisting them
# does NOT weaken the scan for real secrets anywhere else in the tree.

title = "CLONE FRAME HUB"

[extend]
useDefault = true

[allowlist]
description = "Vendored / built third-party browser bundles (minified — known generic-api-key false positives)"
paths = [
  '''vendor/xterm/.*''',      # third-party terminal emulator (xterm.js), vendored verbatim
  '''privy-login\.js''',      # our esbuild bundle of the Privy React SDK (public client bundle)
  '''login-island/.*''',      # the Privy login island source + build
]
