# CLONE FRAME HUB — one-command sandboxed run.
#
#   docker compose up --build
#   → then open  http://127.0.0.1:8765  in your browser.
#
# The shell, files, and network the app touches live INSIDE this container, not on
# your host — that sandbox is why running in Docker is the recommended, safer path.
#
# SECURITY: the port is published to your host's LOOPBACK only (127.0.0.1). Do NOT
# change it to "8765:8765" or "0.0.0.0" — the loopback-only publish is part of the
# container-mode boundary. The pairing token is still required for every real call.
services:
  hub:
    build: .
    image: clone-frame-hub:local
    container_name: clone-frame-hub
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      HUB_BRIDGE_HOST: "0.0.0.0"
      HUB_BRIDGE_CONTAINER: "1"
      HUB_BRIDGE_PORT: "8765"
      # The bridge refuses a non-loopback bind unless this says the exposure is intended.
      # It belongs HERE and not in the Dockerfile, because it is only true next to the
      # loopback-only publish above. Change that "127.0.0.1:" prefix and this consent is
      # a lie — you would be handing an unauthenticated shell to your network.
      HUB_BRIDGE_ALLOW_PUBLIC: "1"
      CLONE_FRAME_HUB_ROOT: "/data"
    volumes:
      - cfhub-state:/data              # app state — agents, harnesses, settings, notes …
      # /home/node, not /root: the Dockerfile runs as USER node, so homedir() — which is what
      # bridge/folders.mjs resolves ~/CloneFrame from — is /home/node. Mounted at /root the
      # volume was real, empty and never written to, while the tree the app created lived on the
      # container's writable layer and died with the container. The README promises it persists.
      - cfhub-data:/home/node/CloneFrame   # the ~/CloneFrame folders — Models, Data, Downloads …
    restart: unless-stopped

volumes:
  cfhub-state:
  cfhub-data:
