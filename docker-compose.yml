# CLONE FRAME HUB — one-command sandboxed run.
#
#   docker compose up --build
#   → then open  http://127.0.0.1:8765  in your browser.
#
# The shell, files, and network the app touches live INSIDE this container, not on
# your host — that sandbox is why running in Docker is the recommended, safer path.
#
# SECURITY: the port is published to your host's LOOPBACK only (127.0.0.1). Do NOT
# change it to "8765:8765" or "0.0.0.0" — the loopback-only publish is part of the
# container-mode boundary. The pairing token is still required for every real call.
services:
  hub:
    build: .
    image: clone-frame-hub:local
    container_name: clone-frame-hub
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      HUB_BRIDGE_HOST: "0.0.0.0"
      HUB_BRIDGE_CONTAINER: "1"
      HUB_BRIDGE_PORT: "8765"
      CLONE_FRAME_HUB_ROOT: "/data"
    volumes:
      - cfhub-state:/data              # app state — agents, harnesses, settings, notes …
      - cfhub-data:/root/CloneFrame    # the ~/CloneFrame folders — Models, Data, Downloads …
    restart: unless-stopped

volumes:
  cfhub-state:
  cfhub-data:
