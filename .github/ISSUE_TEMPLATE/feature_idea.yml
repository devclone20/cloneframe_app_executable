name: Feature idea
description: Something the app should be able to do and cannot
labels: ["idea", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Two things to know before you write, so your time is not wasted:

        **The surface is deliberately small.** A new tab, a new button or a new panel is a
        large ask here, not a small one. An idea that fits an existing surface — or removes
        the need for one — has a much better chance.

        **There is no built-in assistant and there never will be.** Every chat routes to a
        model *you* connect. Ideas that assume a model of ours will be declined.

  - type: textarea
    id: problem
    attributes:
      label: What are you actually trying to do
      description: >
        The task, not the feature. "I want to get back to the folder I was in yesterday"
        tells us more than "add a recent-folders dropdown" — and often has a better answer
        than the one you had in mind.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What do you do today instead
      description: The workaround, however ugly. This is how we judge how much it costs you.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What you think it should look like
      description: Optional. If you have a shape in mind, describe it — including where it lives.
    validations:
      required: false

  - type: dropdown
    id: surface
    attributes:
      label: Where would this live
      options:
        - Inside a panel that already exists
        - The command palette (⌘K)
        - The bridge / an agent tool, with no visual change
        - It needs a new visual surface
        - I do not know
    validations:
      required: true
